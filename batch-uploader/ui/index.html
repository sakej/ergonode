<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ergonode Batch Uploader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <h1>Ergonode Batch Uploader</h1>
    </header>

    <!-- Settings Card — full form when disconnected -->
    <section class="card" id="settings-card">
      <h2>Connection Settings</h2>
      <div class="form-group">
        <label for="api-url">API URL</label>
        <input type="url" id="api-url" placeholder="https://your-instance.ergonode.cloud">
      </div>
      <div class="form-group">
        <label for="api-key">API Key <span class="label-hint">(must have "Allow to write" privilege)</span></label>
        <div class="input-with-toggle">
          <input type="password" id="api-key" placeholder="Enter your API key">
          <button type="button" class="btn-icon" id="toggle-key" title="Show/hide API key">
            <span id="eye-icon">Show</span>
          </button>
        </div>
      </div>
      <div class="button-row">
        <button class="btn btn-primary" id="btn-connect">Connect</button>
        <button class="btn btn-secondary" id="btn-clear">Clear Settings</button>
      </div>
      <div id="connection-status" class="status-message hidden"></div>
    </section>

    <!-- Connected bar — compact after successful connection -->
    <div id="connected-bar" class="connected-bar hidden">
      <div class="connected-info">
        <span class="connected-dot"></span>
        <span class="connected-label">Connected to <strong id="connected-url"></strong></span>
      </div>
      <button class="btn btn-small btn-ghost" id="btn-disconnect">Disconnect</button>
    </div>

    <!-- Workspace (hidden until connected) -->
    <div id="workspace" class="hidden">

      <!-- Folder Tree Card -->
      <section class="card" id="folder-card">
        <div class="card-header">
          <h2>Upload Destination</h2>
          <div class="button-row">
            <button class="btn btn-small btn-ghost" id="btn-new-folder">+ New Folder</button>
            <button class="btn btn-small btn-ghost" id="btn-refresh-folders">Refresh</button>
          </div>
        </div>
        <div id="new-folder-form" class="hidden">
          <div class="inline-form">
            <input type="text" id="new-folder-name" placeholder="Folder name">
            <button class="btn btn-small btn-primary" id="btn-create-folder">Create</button>
            <button class="btn btn-small btn-ghost" id="btn-cancel-folder">Cancel</button>
          </div>
          <div id="new-folder-status" class="status-message hidden"></div>
        </div>
        <div id="folder-tree" class="folder-tree">
          <div class="folder-loading">Loading folders...</div>
        </div>
        <div id="selected-folder-display" class="selected-folder">
          Destination: <strong id="selected-folder-path">/ (root)</strong>
        </div>
      </section>

      <!-- Drop Zone + File List Card -->
      <section class="card" id="files-card">
        <h2>Files</h2>
        <div id="drop-zone" class="drop-zone">
          <div class="drop-zone-content">
            <div class="drop-zone-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p>Drag &amp; drop files here or <span class="link-text">browse</span></p>
          </div>
        </div>

        <div id="upload-controls" class="hidden">
          <div class="upload-header">
            <div class="upload-summary">
              <span id="upload-counter">0 / 0 complete</span>
              <span id="rate-limit-msg" class="rate-limit-msg hidden"></span>
            </div>
            <div class="button-row">
              <label class="concurrency-toggle" title="Limit to one upload at a time">
                <input type="checkbox" id="single-connection">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-label">Single connection</span>
              </label>
              <button class="btn btn-primary" id="btn-upload">Upload All</button>
              <button class="btn btn-stop hidden" id="btn-stop">Stop</button>
              <button class="btn btn-ghost" id="btn-clear-files">Clear All</button>
              <button class="btn btn-revert hidden" id="btn-revert">Revert Upload</button>
            </div>
          </div>
          <div id="file-list" class="file-list"></div>
        </div>
      </section>

    </div>

    <!-- Folder Structure Confirmation Modal -->
    <div id="folder-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 class="modal-title">Create folder structure?</h3>
        <p id="folder-modal-body" class="modal-body"></p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="folder-modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="folder-modal-continue">Continue</button>
        </div>
      </div>
    </div>

    <!-- Revert Upload Confirmation Modal -->
    <div id="revert-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 class="modal-title">Revert last upload?</h3>
        <p class="modal-body">This will permanently delete items from Ergonode.</p>
        <div class="revert-options">
          <label class="revert-checkbox">
            <input type="checkbox" id="revert-files-check" checked>
            <span id="revert-files-label">Delete uploaded files (0)</span>
          </label>
          <label class="revert-checkbox" id="revert-folders-row">
            <input type="checkbox" id="revert-folders-check" checked>
            <span id="revert-folders-label">Delete created folders (0)</span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="revert-modal-cancel">Cancel</button>
          <button class="btn btn-revert" id="revert-modal-confirm">Revert</button>
        </div>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
