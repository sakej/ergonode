name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: batch-uploader

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Fix DMG (remove hidden files)
        if: runner.os == 'macOS'
        run: |
          for DMG in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -f "$DMG" ] || continue
            echo "Fixing $DMG"
            TEMP="${DMG}.rw.dmg"
            hdiutil convert "$DMG" -format UDRW -o "$TEMP"
            MOUNT=$(hdiutil attach "$TEMP" -readwrite -noverify -nobrowse | grep "/Volumes/" | sed 's/.*\/Volumes/\/Volumes/')
            echo "Mounted at: $MOUNT"
            rm -f "$MOUNT/.VolumeIcon.icns"
            SetFile -a c "$MOUNT" 2>/dev/null || true
            sleep 2
            rm -rf "$MOUNT/.fseventsd" "$MOUNT/.DS_Store" "$MOUNT/.Trashes" "$MOUNT/.Spotlight-V100" 2>/dev/null || true
            sync
            hdiutil detach "$MOUNT" -force
            rm "$DMG"
            hdiutil convert "$TEMP" -format UDZO -o "$DMG"
            rm "$TEMP"
            echo "Fixed: $DMG"
          done

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            batch-uploader/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            batch-uploader/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            batch-uploader/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            batch-uploader/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS ARM)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: batch-uploader/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload artifacts (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: batch-uploader/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Ergonode Batch Uploader ${{ github.event.inputs.version }}
          body: |
            ## Ergonode Batch Uploader ${{ github.event.inputs.version }}

            Desktop app for bulk-uploading images to your Ergonode media library.

            ### Downloads

            | OS | File | Architecture |
            |---|---|---|
            | Windows | `.msi` or `.exe` installer | x64 |
            | macOS | `.dmg` | ARM (Apple Silicon) |
            | macOS | `.dmg` | x64 (Intel) |
            | Linux | `.AppImage` or `.deb` | x64 |

            ### Requirements
            - An Ergonode instance with API access
            - An API key with "Allow to write" privilege
          draft: false
          prerelease: false
          files: artifacts/**/*
